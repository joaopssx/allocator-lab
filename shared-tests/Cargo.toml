[package]
name = "shared-tests"
description = "Tests that run against every allocator in the workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
alloc-core = { path = "../core" }
bump = { path = "../bump" }
buddy = { path = "../buddy" }
freelist = { path = "../freelist" }
slab = { path = "../slab" }

[lints]
workspace = true

[features]
# Runs every test with the allocators verifying their invariants after each
# operation.
debug-checks = [
    "bump/debug-checks",
    "buddy/debug-checks",
    "freelist/debug-checks",
    "slab/debug-checks",
]

[dev-dependencies]
proptest = "1.12.0"

[[test]]
name = "global_slab"
harness = false
